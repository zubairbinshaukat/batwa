<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Batwa</title>
  <!-- Flat 2-tone reduction of the clay wallet mark. The 3D render is the
       real logo; at 16px none of its depth survives, so the tab icon keeps
       only the silhouette: back pocket, two cards, folded flap, clasp. -->
  <rect x="2.4" y="6.6" width="19.2" height="14.9" rx="4.2" fill="#4F33E8"/>
  <g transform="rotate(-8 12 7)">
    <rect x="5.2" y="2.6" width="12.6" height="7.4" rx="1.7" fill="#9B86F7"/>
    <rect x="7.3" y="4.1" width="12.6" height="7.4" rx="1.7" fill="#F3EDE0"/>
  </g>
  <rect x="3.7" y="9.1" width="16.6" height="9.6" rx="3.1" fill="#6248F5"/>
  <circle cx="16.9" cy="13.9" r="1.55" fill="#9B86F7"/>
</svg>
