  <script>
    // Theme, before the first paint — a module import would land after it and
    // flash white. Mirrors js/theme.js; keep the key and values in step.
    (function () {
      try {
        var m = localStorage.getItem("batwa.theme");
        if (m !== "light" && m !== "dark") {
          m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", m);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && m === "dark") meta.setAttribute("content", "#3A22C2");
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/onboarding.css">

  <!-- Structured data. `softwareVersion` mirrors the sw.js cache number and
       APP_VERSION in js/config.js — bump all three together. No LICENSE file
       in the repo, so no `license` key (a 404 there is worse than nothing). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Batwa",
    "alternateName": ["Batwa by ZUBYR", "ZUBYR Batwa"],
    "url": "https://batwa.zubyr.dev/",
    "description": "Private, offline-first personal budget tracker. PIN-locked, encrypted on the device, no account, no server, no tracking.",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Android, iOS, Windows, macOS, Linux (web browser)",
    "browserRequirements": "Requires JavaScript and a modern browser",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PKR" },
    "image": "https://batwa.zubyr.dev/icons/icon-512-v2.png",
    "screenshot": [
      "https://batwa.zubyr.dev/screenshots/01-home.png",
      "https://batwa.zubyr.dev/screenshots/02-reports.png"
    ],
    "softwareVersion": "32",
    "isAccessibleForFree": true,
    "codeRepository": "https://github.com/zubairbinshaukat/batwa",
    "author": {
      "@type": "Person",
      "name": "Zubair bin Shaukat",
      "alternateName": "ZUBYR",
      "url": "https://zubyr.dev",
      "sameAs": ["https://github.com/zubairbinshaukat"]
    }
  }
  </script>
</head>
<body>

  <div class="canopy" id="canopy">
    <div class="canopy-inner">
      <header class="app-header">
        <div class="greeting">
          <div class="hello" id="hello">Welcome back</div>
          <div class="title">Batwa</div>
        </div>
        <div class="row">
          <button class="sync-pill hidden" id="sync-pill" role="status" aria-label="Sync status"></button>
          <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Theme"></button>
          <!-- Shared spaces. Hidden until this phone holds at least one space,
               and hidden again the moment the last one is left (plan §0). -->
          <button class="icon-btn spaces-btn hidden" id="spaces-btn" aria-label="Shared spaces" title="Shared spaces"></button>
        </div>
      </header>
      <div id="canopy-slot"></div>
    </div>
  </div>

  <div class="app-shell">
    <div id="update-slot"></div>

    <main id="view" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="Main">
    <div class="nav-inner" id="nav"></div>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="lock-root"></div>

  <script src="js/vendor/gsap.min.js"></script>
  <script type="module" src="js/app.js"></script>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif">
      Batwa needs JavaScript to keep your data encrypted on your device.
    </div>
  </noscript>
</body>
</html>
