  <script>
    // Theme, before the first paint — a module import would land after it and
    // flash white. Mirrors js/theme.js; keep the key and values in step.
    (function () {
      try {
        var m = localStorage.getItem("batwa.theme");
        if (m !== "light" && m !== "dark") {
          m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", m);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && m === "dark") meta.setAttribute("content", "#3A22C2");
      } catch (e) {}
    })();
  </script>

  <script>
    // Boot shell: paint the lock screen's own gradient before any JS has
    // rendered anything, closing the gap between the splash handing over and
    // the real first frame. Gated on js/auth.js's "batwa.hasLock" flag, which
    // is only ever "1" while a PIN exists — first run and no-PIN mode must
    // never see this, or onboarding/home would flash under a fake lock.
    // css/components.css paints html[data-boot="lock"] body::after; js/auth.js
    // removes the attribute the moment the real lock screen mounts (or right
    // after unlock when none was needed). The 8s timeout below is a failsafe
    // only — normal boots clear it long before this ever fires.
    (function () {
      try {
        if (localStorage.getItem("batwa.hasLock") === "1") {
          document.documentElement.setAttribute("data-boot", "lock");
        }
      } catch (e) {}
    })();
    setTimeout(function () {
      try { document.documentElement.removeAttribute("data-boot"); } catch (e) {}
    }, 8000);
  </script>

  <script>
    // Performance tier, before the first paint — so a weak phone never even
    // starts a heavy effect. Mirrors js/perf.js; keep the key, values and
    // heuristic in step. (This copy can't check APP_VERSION — no import in a
    // plain <script> — so a saved batwa.perfAuto only gets the 30-day age
    // check here; js/perf.js re-validates the version once it boots and
    // clears the entry if it's from a different build.)
    (function () {
      try {
        var tier;
        var mode = localStorage.getItem("batwa.perf");
        if (mode !== "high" && mode !== "medium" && mode !== "low") mode = "auto";
        // the raw choice, for base.css's reduced-motion block — an explicit
        // "high" there must win over the OS preference, same as it does here.
        document.documentElement.setAttribute("data-perf-mode", mode);
        if (mode === "high" || mode === "medium" || mode === "low") {
          tier = mode; // the user's explicit choice wins, even over reduce motion
        } else if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          tier = "low";
        } else {
          tier = null;
          try {
            var raw = localStorage.getItem("batwa.perfAuto");
            if (raw) {
              var saved = JSON.parse(raw);
              // only a CONFIRMED "low" is authoritative — js/perf.js also
              // saves a bare {strikes,v,at} record for a single ordinary-bad
              // sample (a false-downgrade guard: one noisy sample must never
              // demote a strong phone), and that must never be read as a tier.
              if (saved && saved.tier === "low" && typeof saved.at === "number" && Date.now() - saved.at < 30 * 24 * 60 * 60 * 1000) {
                tier = saved.tier;
              }
            }
          } catch (e) {}
          if (!tier) {
            var mem = navigator.deviceMemory;
            var cores = navigator.hardwareConcurrency;
            var saveData = !!(navigator.connection && navigator.connection.saveData);
            if (saveData) tier = "low";
            else if (typeof mem === "number") {
              tier = (mem <= 2 || cores <= 2) ? "low" : (mem <= 4 || cores <= 4) ? "medium" : "high";
            } else {
              // no deviceMemory (Safari/iOS, Firefox) — never go below medium
              // from cores alone; js/perf.js's smoothness check catches the rest.
              tier = (typeof cores === "number" && cores <= 2) ? "medium" : "high";
            }
          }
        }
        document.documentElement.setAttribute("data-perf", tier);
      } catch (e) {}
    })();
  </script>

  <!-- defer, not a plain classic script: deferred classic scripts and module
       scripts both execute in document order after parsing, so gsap is still
       guaranteed to run (and define window.gsap) before js/app.js does — it
       just never blocks the parser while it downloads. It sits in <head>, not
       at the end of <body>, because the build injects the app's module script
       at the end of <head>: gsap must come before it in the document for that
       order to hold. Served as-is from public/. -->
  <script defer src="js/vendor/gsap.min.js" vite-ignore></script>
