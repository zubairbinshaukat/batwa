<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Batwa — Budget</title>
  <meta name="description" content="Private, offline-first personal budget tracker. Your money, your phone, encrypted.">
  <meta name="theme-color" content="#4F33E8">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Batwa">

  <script>
    // Theme, before the first paint — a module import would land after it and
    // flash white. Mirrors js/theme.js; keep the key and values in step.
    (function () {
      try {
        var m = localStorage.getItem("batwa.theme");
        if (m !== "light" && m !== "dark") {
          m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", m);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && m === "dark") meta.setAttribute("content", "#100D28");
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body>

  <div class="app-shell">
    <header class="app-header">
      <div class="greeting">
        <div class="hello" id="hello">Welcome back</div>
        <div class="title">Batwa</div>
      </div>
      <div class="row">
        <button class="sync-pill hidden" id="sync-pill" role="status" aria-label="Sync status"></button>
      </div>
    </header>

    <div id="update-slot"></div>

    <main id="view" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="Main">
    <div class="nav-inner" id="nav"></div>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="lock-root"></div>

  <script src="js/vendor/gsap.min.js"></script>
  <script type="module" src="js/app.js"></script>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif">
      Batwa needs JavaScript to keep your data encrypted on your device.
    </div>
  </noscript>
</body>
</html>
